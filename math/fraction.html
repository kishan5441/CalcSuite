<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fraction Calculator | CalcSuite</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../js/common.js"></script>
<style>
:root{--bg:#f1f5f9;--card:#fff;--text:#172033;--muted:#64748b;--border:#e2e8f0;--accent:#0d9488}
.dark{--bg:#0f172a;--card:#1e293b;--text:#e5edf8;--muted:#94a3b8;--border:#334155}
*{box-sizing:border-box}body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:22px}
input,select{width:100%;padding:12px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text)}
label{display:block;font-size:13px;font-weight:600;margin-bottom:7px;color:var(--muted)}
.btn{padding:12px 17px;border-radius:10px;background:var(--accent);color:white;font-weight:700}
.secondary{background:var(--bg);color:var(--text);border:1px solid var(--border)}
.muted{color:var(--muted)}.value{font-size:32px;font-weight:800;color:var(--accent)}
.step{padding:12px;border-radius:10px;background:var(--bg);margin-top:8px;font-size:14px}
</style>
</head>
<body>
<header class="max-w-3xl mx-auto p-4 flex justify-between">
<a href="../index.html" class="font-bold text-teal-600">← CalcSuite</a>
<button id="themeToggle" class="btn secondary">☼ Theme</button>
</header>
<main class="max-w-3xl mx-auto p-4 space-y-5">
<section>
<p class="text-sm font-bold text-teal-600">MATH TOOLS</p>
<h1 class="text-3xl font-extrabold mt-1">Fraction Calculator</h1>
<p class="muted mt-2">Add, subtract, multiply, divide and simplify fractions step by step.</p>
</section>

<section class="card">
<div class="grid grid-cols-2 gap-4">
<div>
<h3 class="font-bold mb-3">First fraction</h3>
<label>Numerator</label>
<input type="number" id="n1" value="1">
<label class="mt-3">Denominator</label>
<input type="number" id="d1" value="2">
</div>
<div>
<h3 class="font-bold mb-3">Second fraction</h3>
<label>Numerator</label>
<input type="number" id="n2" value="1">
<label class="mt-3">Denominator</label>
<input type="number" id="d2" value="3">
</div>
</div>

<div class="mt-5">
<label>Operation</label>
<select id="operation">
<option value="+">Addition (+)</option>
<option value="-">Subtraction (−)</option>
<option value="*">Multiplication (×)</option>
<option value="/">Division (÷)</option>
</select>
</div>
<button class="btn w-full mt-5" onclick="calculate()">Calculate Fraction</button>
</section>

<section id="result" class="card hidden">
<p class="muted text-sm">Final simplified answer</p>
<div id="answer" class="value mt-2"></div>
<p class="muted mt-2" id="decimal"></p>
<h3 class="font-bold mt-6 mb-3">Step-by-step solution</h3>
<div id="steps"></div>
</section>
</main>

<script>
initTheme();

function gcd(a,b){
 a=Math.abs(a);b=Math.abs(b);
 while(b){const t=b;b=a%b;a=t}
 return a||1;
}

function simplify(n,d){
 if(d<0){n=-n;d=-d}
 const g=gcd(n,d);
 return {n:n/g,d:d/g};
}

function calculate(){
 const n1=Number(document.getElementById('n1').value);
 const d1=Number(document.getElementById('d1').value);
 const n2=Number(document.getElementById('n2').value);
 const d2=Number(document.getElementById('d2').value);
 const op=document.getElementById('operation').value;

 if(![n1,d1,n2,d2].every(Number.isSafeInteger)){
  alert('Please enter valid whole numbers.');
  return;
 }
 if(d1===0||d2===0){
  alert('Denominator cannot be zero.');
  return;
 }
 if(op==='/'&&n2===0){
  alert('Cannot divide by a zero fraction.');
  return;
 }

 let n,d,steps=[];

 if(op==='+'||op==='-'){
  const common=d1/gcd(d1,d2)*d2;
  const first=n1*(common/d1);
  const second=n2*(common/d2);
  n=op==='+'?first+second:first-second;
  d=common;
  steps.push('Find the least common denominator: '+common);
  steps.push('Convert first fraction: '+first+'/'+common);
  steps.push('Convert second fraction: '+second+'/'+common);
  steps.push('Combine numerators: '+first+' '+op+' '+second+' = '+n);
  steps.push('Result before simplification: '+n+'/'+d);
 }else if(op==='*'){
  n=n1*n2;d=d1*d2;
  steps.push('Multiply numerators: '+n1+' × '+n2+' = '+n);
  steps.push('Multiply denominators: '+d1+' × '+d2+' = '+d);
  steps.push('Result before simplification: '+n+'/'+d);
 }else{
  n=n1*d2;d=d1*n2;
  steps.push('Keep the first fraction: '+n1+'/'+d1);
  steps.push('Flip the second fraction: '+d2+'/'+n2);
  steps.push('Multiply: '+n1+' × '+d2+' = '+n);
  steps.push('Multiply: '+d1+' × '+n2+' = '+d);
  steps.push('Result before simplification: '+n+'/'+d);
 }

 if(!Number.isSafeInteger(n)||!Number.isSafeInteger(d)){
  alert('Numbers are too large. Please use smaller values.');
  return;
 }

 const simplified=simplify(n,d);
 const mixedWhole=Math.trunc(simplified.n/simplified.d);
 const remainder=Math.abs(simplified.n%simplified.d);

 steps.push('Find GCD: '+gcd(n,d));
 steps.push('Divide numerator and denominator by GCD.');
 steps.push('Simplified fraction: '+simplified.n+'/'+simplified.d);

 if(remainder!==0){
  steps.push('Mixed number: '+mixedWhole+' '+remainder+'/'+simplified.d);
 }

 document.getElementById('answer').textContent=
 simplified.d===1?String(simplified.n):simplified.n+'/'+simplified.d;

 document.getElementById('decimal').textContent=
 'Decimal value: '+(simplified.n/simplified.d).toFixed(8).replace(/0+$/,'').replace(/\.$/,'');

 document.getElementById('steps').innerHTML=steps.map((s,i)=>
 `<div class="step"><b>Step ${i+1}:</b> ${s}</div>`
 ).join('');

 document.getElementById('result').classList.remove('hidden');
}
</script>
</body>
</html>
